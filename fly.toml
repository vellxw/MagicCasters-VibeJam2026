# fly.toml app configuration file generated for gamejam-proyect on 2026-05-01T11:26:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gamejam-proyect'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 120
    soft_limit = 80

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
