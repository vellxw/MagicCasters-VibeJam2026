app = "vibejam-magic-duel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 120

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
